apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'com.github.johnrengelman.shadow'

version = project.mod_version
group = project.mod_group
archivesBaseName = 'ice-rlcraft-optimizer'
sourceCompatibility = targetCompatibility = '1.8'

tasks.withType(JavaCompile) {
    sourceCompatibility = targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}
tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

sourceSets {
    early {
        java.srcDir 'src/early/java'
        compileClasspath += configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    hooks {
        java.srcDir 'src/hooks/java'
        resources.srcDir 'src/hooks/resources'
        compileClasspath += sourceSets.early.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    profiler {
        java.srcDir 'src/profiler/java'
        resources.srcDir 'src/profiler/resources'
        compileClasspath += configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
sourceSets.main.compileClasspath += sourceSets.early.output
sourceSets.main.runtimeClasspath += sourceSets.early.output + sourceSets.hooks.output

minecraft {
    mappings channel: 'stable', version: '39-1.12'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods { ice { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods { ice { source sourceSets.main } }
        }
    }
}

repositories { mavenCentral() }
repositories { maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } }
repositories { maven { url = 'https://www.cursemaven.com' } }
repositories { maven { url = 'https://api.modrinth.com/maven' } }
configurations { optimizerLibraries }
dependencies {
    // API only: the pack supplies RenderLib. Never bundle the external renderer or its libraries.
    if (project.hasProperty('renderLibJar')) {
        hooksCompileOnly files(project.property('renderLibJar'))
    } else {
        hooksCompileOnly('maven.modrinth:renderlib:1.12.2-1.4.5') { transitive = false }
    }
    // BO3 configuration arrays are supplied by OTG, never bundled with ICE.
    if (project.hasProperty('otgJar')) {
        compileOnly files(project.property('otgJar'))
        testCompileOnly files(project.property('otgJar'))
        testRuntimeOnly files(project.property('otgJar'))
    } else {
        compileOnly('curse.maven:open-terrain-generator-265894:7004304') { transitive = false }
        testCompileOnly('curse.maven:open-terrain-generator-265894:7004304') { transitive = false }
        testRuntimeOnly('curse.maven:open-terrain-generator-265894:7004304') { transitive = false }
    }
    // Optional superclass API for the per-build Recurrent Complex field cache.
    // IvToolkit remains supplied by the modpack and is never bundled.
    if (project.hasProperty('ivToolkitJar')) {
        compileOnly files(project.property('ivToolkitJar'))
        testCompileOnly files(project.property('ivToolkitJar'))
        testRuntimeOnly files(project.property('ivToolkitJar'))
    } else {
        compileOnly('curse.maven:ivtoolkit-224535:2443253') { transitive = false }
        testCompileOnly('curse.maven:ivtoolkit-224535:2443253') { transitive = false }
        testRuntimeOnly('curse.maven:ivtoolkit-224535:2443253') { transitive = false }
    }
    // Optional post-merge integration. Mixin is provided by the modpack, never bundled by ICE.
    if (project.hasProperty('mixinApiJar')) {
        hooksCompileOnly files(project.property('mixinApiJar'))
        testCompileOnly files(project.property('mixinApiJar'))
        testRuntimeOnly files(project.property('mixinApiJar'))
    } else {
        hooksCompileOnly('org.spongepowered:mixin:0.8.5') { transitive = false }
        testCompileOnly('org.spongepowered:mixin:0.8.5') { transitive = false }
        testRuntimeOnly('org.spongepowered:mixin:0.8.5') { transitive = false }
    }
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    // The partial Windows/Java 8 recomp JAR omits unchanged vanilla classes.
    def mappedVersion = '1.12.2-14.23.5.2860_mapped_stable_39-1.12'
    def mappedJar = new File(gradle.gradleUserHomeDir,
        "caches/forge_gradle/minecraft_user_repo/net/minecraftforge/forge/${mappedVersion}/forge-${mappedVersion}.jar")
    compileOnly files(mappedJar)
    runtimeOnly files(mappedJar)
    testCompileOnly files(mappedJar)
    testRuntimeOnly files(mappedJar)
    optimizerLibraries 'org.agrona:agrona:1.17.1'
    optimizerLibraries 'com.github.ben-manes.caffeine:caffeine:2.9.3'
    optimizerLibraries 'org.lz4:lz4-java:1.8.0'
    implementation configurations.optimizerLibraries
    testImplementation 'junit:junit:4.13.2'
}
