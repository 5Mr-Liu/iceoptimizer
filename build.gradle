    destinationDir = file("$buildDir/libs")
    configurations = [project.configurations.optimizerLibraries]
    relocate 'org.agrona', 'dev.rlcraft.ice.shadow.agrona'
    relocate 'com.github.benmanes.caffeine', 'dev.rlcraft.ice.shadow.caffeine'
    relocate 'net.jpountz', 'dev.rlcraft.ice.shadow.lz4'
