buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://plugins.gradle.org/m2/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
        classpath 'com.github.jengelman.gradle.plugins:shadow:4.0.4'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'com.github.johnrengelman.shadow'

version = project.mod_version
group = project.mod_group
archivesBaseName = 'ice-rlcraft-optimizer'

def sourceDateEpochText = System.getenv('SOURCE_DATE_EPOCH')
def sourceDateEpochSeconds = (sourceDateEpochText == null
    || sourceDateEpochText.trim().isEmpty())
    ? 0L : Long.parseLong(sourceDateEpochText.trim())
if (sourceDateEpochSeconds < 0L) {
    throw new GradleException('SOURCE_DATE_EPOCH must be non-negative')
}
def implementationTimestamp = new Date(Math.multiplyExact(
    sourceDateEpochSeconds, 1000L)).format(
        "yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone('UTC'))

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

minecraft {
    mappings channel: 'stable', version: '39-1.12'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                ice {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                ice {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
}

configurations {
    optimizerLibraries
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'

    // ForgeGradle 3.0.197 sometimes exposes only the partial "recomp" jar on Java 8/Windows.
    // The normal mapped jar is generated beside it and supplies unchanged vanilla classes.
    def mappedVersion = '1.12.2-14.23.5.2860_mapped_stable_39-1.12'
    def mappedJar = new File(
        gradle.gradleUserHomeDir,
        "caches/forge_gradle/minecraft_user_repo/net/minecraftforge/forge/${mappedVersion}/forge-${mappedVersion}.jar"
    )
    compileOnly files(mappedJar)
    runtimeOnly files(mappedJar)
    testCompileOnly files(mappedJar)
    testRuntimeOnly files(mappedJar)

    optimizerLibraries 'org.agrona:agrona:1.17.1'
    optimizerLibraries 'com.github.ben-manes.caffeine:caffeine:2.9.3'
    optimizerLibraries 'org.lz4:lz4-java:1.8.0'
    implementation configurations.optimizerLibraries

    testImplementation 'junit:junit:4.13.2'
}

sourceSets {
    hooks {
        java.srcDir 'src/hooks/java'
        resources.srcDir 'src/hooks/resources'
        compileClasspath += configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

sourceSets.test.compileClasspath += sourceSets.hooks.output
sourceSets.test.runtimeClasspath += sourceSets.hooks.output

