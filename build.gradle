// ForgeGradle rewrites every entry timestamp while reobfuscating, even when
// the input Jar task is reproducible.  Normalize the completed release JAR in
// the same task so direct reobf invocations, bundles and pinned deployment
// hashes all observe identical bytes for identical inputs.
def normalizeReobfuscatedJar = { File archive ->
    if (!archive.isFile()) {
        throw new GradleException("Missing reobfuscated archive: ${archive}")
    }

    File temporary = new File(
        archive.parentFile,
        ".${archive.name}.${UUID.randomUUID()}.normalizing"
    )
    def input = new java.util.zip.ZipFile(archive)
    try {
        def entries = []
        def enumeration = input.entries()
        def names = new HashSet<String>()
        while (enumeration.hasMoreElements()) {
            def entry = enumeration.nextElement()
            if (!names.add(entry.name)) {
                throw new GradleException("Duplicate entry in ${archive.name}: ${entry.name}")
            }
            entries.add(entry)
        }
        entries.sort { left, right -> left.name <=> right.name }

        def output = new java.util.jar.JarOutputStream(
            new BufferedOutputStream(new FileOutputStream(temporary))
        )
        try {
            output.setLevel(java.util.zip.Deflater.DEFAULT_COMPRESSION)
            byte[] buffer = new byte[32 * 1024]
            entries.each { sourceEntry ->
                def targetEntry = new java.util.jar.JarEntry(sourceEntry.name)
                targetEntry.setTime(0L)
                targetEntry.setMethod(java.util.zip.ZipEntry.DEFLATED)
                output.putNextEntry(targetEntry)
                if (!sourceEntry.isDirectory()) {
                    def stream = input.getInputStream(sourceEntry)
                    try {
                        int count
                        while ((count = stream.read(buffer)) >= 0) {
                            output.write(buffer, 0, count)
                        }
                    } finally {
                        stream.close()
                    }
                }
                output.closeEntry()
            }
        } finally {
            output.close()
        }
    } catch (Throwable failure) {
        temporary.delete()
        throw failure
    } finally {
        input.close()
    }

    try {
        java.nio.file.Files.move(
            temporary.toPath(),
            archive.toPath(),
            java.nio.file.StandardCopyOption.ATOMIC_MOVE,
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
        java.nio.file.Files.move(
            temporary.toPath(),
            archive.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    } finally {
        temporary.delete()
    }
}

tasks.matching { it.name == 'reobfShadowJar' }.all {
    doLast {
        normalizeReobfuscatedJar(shadowJar.archivePath)
    }
}

tasks.matching { it.name == 'reobfProfilerJar' }.all {
    doLast {
        normalizeReobfuscatedJar(profilerJar.archivePath)
    }
}

tasks.matching { it.name == 'reobfJar' }.all {
    doLast {
        normalizeReobfuscatedJar(jar.archivePath)
    }
}

def readJarEntries = { File archive ->
    if (!archive.isFile()) throw new GradleException("Missing split artifact: ${archive}")
    def entries = new LinkedHashSet<String>()
    def zip = new java.util.zip.ZipFile(archive)
    try {
        def enumeration = zip.entries()
        while (enumeration.hasMoreElements()) entries.add(enumeration.nextElement().name)
    } finally {
        zip.close()
    }
    return entries
}

def readJarEntryText = { File archive, String entryName ->
    def zip = new java.util.zip.ZipFile(archive)
    try {
        def entry = zip.getEntry(entryName)
        if (entry == null) throw new GradleException("${archive.name} is missing ${entryName}")
        def input = zip.getInputStream(entry)
        try {
            def output = new ByteArrayOutputStream()
            byte[] buffer = new byte[4096]
            int count
            while ((count = input.read(buffer)) >= 0) output.write(buffer, 0, count)
            return new String(output.toByteArray(), 'UTF-8')
        } finally {
            input.close()
        }
    } finally {
        zip.close()
    }
}

def readManifestAttribute = { File archive, String name ->
    def jarFile = new java.util.jar.JarFile(archive)
    try {
        return jarFile.manifest.mainAttributes.getValue(name)
    } finally {
        jarFile.close()
    }
}

def jarContainsUtf8 = { File archive, String needle ->
    byte[] expected = needle.getBytes('UTF-8')
    def zip = new java.util.zip.ZipFile(archive)
    try {
        def enumeration = zip.entries()
        while (enumeration.hasMoreElements()) {
            def entry = enumeration.nextElement()
            if (entry.isDirectory() || !entry.name.endsWith('.class')) continue
            byte[] bytes
            def input = zip.getInputStream(entry)
            try {
                def output = new ByteArrayOutputStream()
                byte[] buffer = new byte[4096]
                int count
                while ((count = input.read(buffer)) >= 0) output.write(buffer, 0, count)
                bytes = output.toByteArray()
            } finally {
                input.close()
            }
            for (int offset = 0; offset <= bytes.length - expected.length; offset++) {
                boolean matches = true
                for (int index = 0; index < expected.length; index++) {
                    if (bytes[offset + index] != expected[index]) {
                        matches = false
                        break
                    }
                }
                if (matches) return true
            }
        }
        return false
    } finally {
        zip.close()
    }
}

def requireEntry = { Set<String> entries, String entry, String artifact ->
    if (!entries.contains(entry)) throw new GradleException("${artifact} is missing ${entry}")
}

task verifySplitJars(dependsOn: [reobfShadowJar, reobfProfilerJar, optimizerCoreJar, profilerCoreJar]) {
    doLast {
        Set<String> optimizer = readJarEntries(shadowJar.archivePath)
        Set<String> profiler = readJarEntries(profilerJar.archivePath)
        Set<String> optimizerCore = readJarEntries(optimizerCoreJar.archivePath)
        Set<String> profilerCore = readJarEntries(profilerCoreJar.archivePath)

        requireEntry(optimizer, 'dev/rlcraft/ice/IceMod.class', 'optimizer JAR')
        requireEntry(optimizer, 'dev/rlcraft/ice/optimizer/OptimizerConfig.class', 'optimizer JAR')
        requireEntry(optimizer, 'dev/rlcraft/ice/optimizer/OptimizerRegistry.class', 'optimizer JAR')
        requireEntry(optimizer, 'dev/rlcraft/ice/optimizer/proxy/OptimizerServerProxy.class', 'optimizer JAR')
        requireEntry(optimizer, 'dev/rlcraft/ice/optimizer/server/ServerOptimizerRuntime.class', 'optimizer JAR')
        requireEntry(optimizer, 'dev/rlcraft/ice/optimizer/compat/save/ChunkSaveCompressionBridge.class', 'optimizer JAR')
        requireEntry(optimizer, 'dev/rlcraft/ice/optimizer/compat/konkrete/KonkreteLocaleBridge.class', 'optimizer JAR')
        requireEntry(optimizer, 'dev/rlcraft/ice/optimizer/compat/chunk/ForgeBlockStateDirectBridge.class', 'optimizer JAR')
        requireEntry(optimizer, 'mcmod.info', 'optimizer JAR')
        requireEntry(profiler, 'dev/rlcraft/ice/IceProfilerMod.class', 'profiler JAR')
        requireEntry(profiler, 'dev/rlcraft/ice/profiler/core/ProfilerRuntime.class', 'profiler JAR')
        requireEntry(profiler, 'dev/rlcraft/ice/profiler/FatalErrors.class', 'profiler JAR')
        requireEntry(profiler, 'dev/rlcraft/ice/profiler/report/OptimizerRendererDiagnosticsReader.class', 'profiler JAR')
        requireEntry(profiler, 'dev/rlcraft/ice/profiler/sampling/ThreadSamplingPlan.class', 'profiler JAR')
        requireEntry(profiler, 'mcmod.info', 'profiler JAR')
        if (!readJarEntryText(shadowJar.archivePath, 'mcmod.info').contains('"modid": "iceoptimizer"')) {
            throw new GradleException('optimizer JAR contains the wrong mcmod.info')
        }
        if (!readJarEntryText(profilerJar.archivePath, 'mcmod.info').contains('"modid": "iceprofiler"')) {
            throw new GradleException('profiler JAR contains the wrong mcmod.info')
        }

        def optimizerLeaks = optimizer.findAll {
            it.startsWith('dev/rlcraft/ice/profiler/') || it.startsWith('dev/rlcraft/ice/client/') ||
                it.startsWith('dev/rlcraft/ice/command/') || it.startsWith('dev/rlcraft/ice/config/') ||
                it.startsWith('dev/rlcraft/ice/proxy/') || it.startsWith('dev/rlcraft/ice/server/') ||
                it == 'dev/rlcraft/ice/IceProfilerMod.class'
        }
        if (!optimizerLeaks.isEmpty()) throw new GradleException("optimizer JAR contains profiler classes: ${optimizerLeaks}")

        def profilerLeaks = profiler.findAll {
            it.startsWith('dev/rlcraft/ice/optimizer/') || it.startsWith('dev/rlcraft/ice/shadow/') ||
                it == 'dev/rlcraft/ice/IceMod.class'
        }
        if (!profilerLeaks.isEmpty()) throw new GradleException("profiler JAR contains optimizer classes: ${profilerLeaks}")
        if (jarContainsUtf8(profilerJar.archivePath,
            'dev/rlcraft/ice/optimizer/FatalErrors')) {
            throw new GradleException(
                'profiler JAR links the optimizer-only FatalErrors ABI')
        }

        Set<String> optimizerClasses = optimizer.findAll { it.endsWith('.class') } as Set<String>
        Set<String> profilerClasses = profiler.findAll { it.endsWith('.class') } as Set<String>
        Set<String> sharedMainClasses = new LinkedHashSet<String>(optimizerClasses)
        sharedMainClasses.retainAll(profilerClasses)
        if (!sharedMainClasses.isEmpty()) throw new GradleException("main JARs contain duplicate classes: ${sharedMainClasses}")

        requireEntry(optimizerCore, 'dev/rlcraft/ice/hooks/IceOptimizerLoadingPlugin.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/hooks/IceOptimizerTransformer.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/hooks/IceClientOptimizerTransformer.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/hooks/TextureUploadBootstrap.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/hooks/TextureUploadBootstrap$Delegate.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/hooks/ChunkSaveCompressionAdapter.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/hooks/KonkreteLocaleAdapter.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/hooks/ForgeBlockStateDirectAdapter.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/save/PendingTickAccessor.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/save/RegionFileRawWriteAccessor.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/chunk/ChunkBufferAccessor.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/chunk/ChunkVertexBufferAccessor.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/chunk/ChunkDispatcherPolicyAccessor.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/chunk/TerrainRenderListAccessor.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/chunk/TerrainVisibilityAccessor.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/chunk/TerrainRenderInfoAccessor.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/chunk/TerrainRenderChunkIndexAccessor.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/chunk/TerrainCompiledChunkAccessor.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/chunk/TerrainVisibilityMaskAccessor.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/gl/EarlyGlStateTracker.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/gl/EarlyGlStateTracker$Snapshot.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/gl/EarlyMatrixStateTracker.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/gl/EarlyMatrixStateTracker$1.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/gl/EarlyMatrixStateTracker$MatrixStack.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/gl/EarlyMatrixStateTracker$Snapshot.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/gl/EarlyMatrixStateTracker$State.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/optifine/DynamicLightAccessor.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/optifine/DynamicLightsMapAccessor.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/optifine/OptifineVboRegionAccess.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/hud/FontRenderCacheAccess.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/particle/ParticleRenderAccess.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/lycanites/LycanitesSpawnScanAccessor.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/lycanites/LycanitesRawNodeAccessor.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/iceandfire/IceAndFireRawNodeAccessor.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/mobends/MoBendsQuaternionAccess.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'dev/rlcraft/ice/optimizer/compat/srp/SrpSpawnFilterCallbacks.class', 'optimizer core JAR')
        requireEntry(optimizerCore, 'optimizer-targets.properties', 'optimizer core JAR')
        requireEntry(profilerCore, 'dev/rlcraft/ice/hooks/IceProfilerLoadingPlugin.class', 'profiler core JAR')
        requireEntry(profilerCore, 'dev/rlcraft/ice/hooks/IceProfilerTransformer.class', 'profiler core JAR')
        requireEntry(profilerCore, 'dev/rlcraft/ice/hooks/ProbeProtocol.class', 'profiler core JAR')
        if (readManifestAttribute(optimizerCoreJar.archivePath, 'FMLCorePlugin') != 'dev.rlcraft.ice.hooks.IceOptimizerLoadingPlugin') {
            throw new GradleException('optimizer core JAR declares the wrong FMLCorePlugin')
        }
        if (readManifestAttribute(profilerCoreJar.archivePath, 'FMLCorePlugin') != 'dev.rlcraft.ice.hooks.IceProfilerLoadingPlugin') {
            throw new GradleException('profiler core JAR declares the wrong FMLCorePlugin')
        }

        if (optimizerCore.any { it.startsWith('dev/rlcraft/ice/hooks/IceProfiler') || it.startsWith('dev/rlcraft/ice/hooks/ProbeProtocol') }) {
            throw new GradleException('optimizer core JAR contains profiler hook classes')
        }
        if (profilerCore.any { it.startsWith('dev/rlcraft/ice/hooks/IceOptimizer') || it.startsWith('dev/rlcraft/ice/hooks/IceClientOptimizer') || it == 'optimizer-targets.properties' }) {
            throw new GradleException('profiler core JAR contains optimizer hook classes')
        }

        if (optimizer.contains('dev/rlcraft/ice/optimizer/compat/save/PendingTickAccessor.class')) {
            throw new GradleException('optimizer JAR contains the early CoreMod PendingTickAccessor ABI')
        }
        if (optimizer.contains('dev/rlcraft/ice/optimizer/compat/save/RegionFileRawWriteAccessor.class')) {
            throw new GradleException('optimizer JAR contains the early CoreMod RegionFileRawWriteAccessor ABI')
        }
        if (optimizer.contains('dev/rlcraft/ice/optimizer/compat/iceandfire/IceAndFireRawNodeAccessor.class')) {
            throw new GradleException('optimizer JAR contains the early CoreMod IceAndFireRawNodeAccessor ABI')
        }
        if (optimizer.contains('dev/rlcraft/ice/optimizer/compat/chunk/ChunkBufferAccessor.class') ||
            optimizer.contains('dev/rlcraft/ice/optimizer/compat/chunk/ChunkVertexBufferAccessor.class') ||
            optimizer.contains('dev/rlcraft/ice/optimizer/compat/chunk/TerrainRenderListAccessor.class') ||
            optimizer.contains('dev/rlcraft/ice/optimizer/compat/chunk/TerrainVisibilityAccessor.class') ||
            optimizer.contains('dev/rlcraft/ice/optimizer/compat/chunk/TerrainRenderInfoAccessor.class') ||
            optimizer.contains('dev/rlcraft/ice/optimizer/compat/chunk/TerrainRenderChunkIndexAccessor.class') ||
            optimizer.contains('dev/rlcraft/ice/optimizer/compat/chunk/TerrainCompiledChunkAccessor.class') ||
            optimizer.contains('dev/rlcraft/ice/optimizer/compat/chunk/TerrainVisibilityMaskAccessor.class') ||
            optimizer.any { entry ->
                entry.startsWith('dev/rlcraft/ice/optimizer/compat/gl/EarlyGlStateTracker') ||
                    entry.startsWith('dev/rlcraft/ice/optimizer/compat/gl/EarlyMatrixStateTracker')
            }) {
            throw new GradleException('optimizer JAR contains early CoreMod chunk-render ABI classes')
        }

        Set<String> optimizerCoreClasses = optimizerCore.findAll { it.endsWith('.class') } as Set<String>
        Set<String> profilerCoreClasses = profilerCore.findAll { it.endsWith('.class') } as Set<String>
        optimizerCoreClasses.retainAll(profilerCoreClasses)
        if (!optimizerCoreClasses.isEmpty()) throw new GradleException("core JARs contain duplicate classes: ${optimizerCoreClasses}")

        Set<String> optimizerMainCoreOverlap = new LinkedHashSet<String>(optimizerClasses)
        optimizerMainCoreOverlap.retainAll(optimizerCore.findAll { it.endsWith('.class') })
        if (!optimizerMainCoreOverlap.isEmpty()) throw new GradleException("optimizer main/core JARs contain duplicate classes: ${optimizerMainCoreOverlap}")
        Set<String> profilerMainCoreOverlap = new LinkedHashSet<String>(profilerClasses)
        profilerMainCoreOverlap.retainAll(profilerCore.findAll { it.endsWith('.class') })
        if (!profilerMainCoreOverlap.isEmpty()) throw new GradleException("profiler main/core JARs contain duplicate classes: ${profilerMainCoreOverlap}")

        if (optimizer.contains('mcmod-optimizer.info') || optimizer.contains('mcmod-profiler.info') ||
            profiler.contains('mcmod-optimizer.info') || profiler.contains('mcmod-profiler.info')) {
            throw new GradleException('source metadata names leaked into a release JAR')
        }
    }
}

build.dependsOn verifySplitJars
